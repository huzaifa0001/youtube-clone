<!DOCTYPE html>
<html>

<head>
    <title>My YouTube Clone</title>
    <link rel="stylesheet" href="styles/navbar.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/sidebar.css">

</head>

<body class="body">
    <div class="navbar">
        <div class="logos">
            <img class="logo" src="icons/images.png" alt="Logo">
            <img class="logo1" src="icons/images (1).png" alt="Logo">
        </div>
        <div class="search">
            <input class="search-bar" type="text" placeholder="Search">
            <button class="search-button"><img class="search-icon" src="icons/images (2).png"></button>
            <button class="mic-button"><img class="mic-icon" src="icons/images (3).png"></button>
        </div>
        <div class="profile">
            <button class="upload">+ Create</button>
            <img class="noti" src="icons/images (4).png" alt="Notifications">
        </div>
    </div>
    <div class="sidebar">
        <div class="section-1">
            <div class="home">
                <button class="home-button">
                    <img class="home-icon" src="icons/home.png" alt="Home">Home
                </button>
            </div>
            <div class="shorts">
                <button class="short-button">
                    <img class="short-icon" src="icons/yt-shorts.png" alt="Shorts">Shorts
                </button>
            </div>
        </div>
        <div class="section-2">
            <div class="subscriptions">
                <button class="subs-button">
                    Subscriptions >
                </button>
            </div>
            <div class="channels">
                <button class="channel-but">
                    <img class="channel-icon" src="images/deji.jpg" alt="Channel"> Deji
                </button>
            </div>
            <div class="channels">
                <button class="channel-but">
                    <img class="channel-icon" src="images/cba.jpg" alt="Channel"> Arsalan Naseer
                </button>
            </div>
            <div class="channels">
                <button class="channel-but">
                    <img class="channel-icon" src="images/ksi.jpg" alt="Channel"> KSI
                </button>
            </div>
            <div class="channels">
                <button class="channel-but">
                    <img class="channel-icon" src="images/markaroni.jpg" alt="Channel"> Markaroni
                </button>
            </div>
            <div class="channels">
                <button class="channel-but">
                    <img class="channel-icon" src="images/ali.jpg" alt="Channel"> Coach Ali
                </button>
            </div>
            <div class="channels">
                <button class="channel-but">
                    <img class="arrow-icon" src="icons/arrow.png" alt="Show More"> Show More
                </button>
            </div>
        </div>
        <div class="section-3">
            <div class="subscriptions">
                <button class="subs-button">
                    You >
                </button>
            </div>
            <div class="channels">
                <button class="channel-but">
                    <img class="channel-ico" src="icons/y-channel.png" alt="Channel"> Your Channel
                </button>
            </div>
            <div class="channels">
                <button class="channel-but">
                    <img class="channel-ico" src="icons/history.png" alt="Channel"> History
                </button>
            </div>
            <div class="channels">
                <button class="channel-but">
                    <img class="channel-ico" src="icons/playlist.png" alt="Channel"> Playlists
                </button>
            </div>
            <div class="channels">
                <button class="channel-but">
                    <img class="channel-ico" src="icons/watch.png" alt="Channel"> Watch later
                </button>
            </div>
            <div class="channels">
                <button class="channel-but">
                    <img class="channel-ico" src="icons/like.png" alt="Channel"> Liked videos
                </button>
            </div>
            <div class="channels">
                <button class="channel-but">
                    <img class="channel-ico" src="icons/lib.png" alt="Channel"> Your videos
                </button>
            </div>
            <div class="channels">
                <button class="channel-but">
                    <img class="channel-ico" src="icons/download.png" alt="Channel"> Downloads
                </button>
            </div>
        </div>
        <div class="section-4">
            <div class="subscriptions">
                <button class="subs-button">
                    Explore
                </button>
            </div>
            <div class="channels">
                <button class="channel-but">
                    <img class="channel-ico" src="icons/music.png" alt="Channel"> Music
                </button>
            </div>
            <div class="channels">
                <button class="channel-but">
                    <img class="channel-ico" src="icons/gaming.png" alt="Channel"> Gaming
                </button>
            </div>
            <div class="channels">
                <button class="channel-but">
                    <img class="channel-ico" src="icons/news.png" alt="Channel"> News
                </button>
            </div>
            <div class="channels">
                <button class="channel-but">
                    <img class="arrow-icon" src="icons/arrow.png" alt="Show More"> Show More
                </button>
            </div>
        </div>
        <div class="section-5">
            <div class="subscriptions">
                <button class="subs-button">
                    More from YouTube
                </button>
            </div>
            <div class="channels">
                <button class="channel-but">
                    <img class="channel-ico" src="icons/yp.png" alt="Channel"> YouTube Premium
                </button>
            </div>
            <div class="channels">
                <button class="channel-but">
                    <img class="channel-ico" src="icons/ym.png" alt="Channel"> YouTube Music
                </button>
            </div>
            <div class="channels">
                <button class="channel-but">
                    <img class="channel-ico" src="icons/yk.png" alt="Channel"> YouTube Kids
                </button>
            </div>
        </div>
        <div class="section-5">
            <div class="subscriptions">
                <button class="subs-button">
                    <img class="channel-ico" src="icons/rh.png" alt="Channel"> Report history
                </button>
            </div>
        </div>
        <div class="section-6">
            <div class="link">
                <a class="links" href="https://www.youtube.com" target="_blank">About</a>
            </div>
            <div class="link">
                <a class="links" href="https://www.youtube.com" target="_blank">Press</a>
            </div>
            <div class="link">
                <a class="links" href="https://www.youtube.com" target="_blank">Copyright</a>
            </div>
        </div>
    </div>
</body>

</html>
